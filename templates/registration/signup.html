{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}
{% block footer %}Copyright © 2024 CampusConnect. All rights reserved.{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">Create your account</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Sign Up</button>
                </form>
                <p class="mt-3 mb-0 text-center">Already have an account? <a href="{% url 'login' %}">Log in here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
